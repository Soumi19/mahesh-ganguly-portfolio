name: Discover Mahesh Ganguly publications
on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-publications.txt
      - name: Discover articles, papers and books
        env:
          MAHESH_OPENALEX_AUTHOR_ID: ${{ vars.MAHESH_OPENALEX_AUTHOR_ID }}
          MAHESH_ORCID: ${{ vars.MAHESH_ORCID }}
        run: python scripts/update_publications.py
      - name: Commit publication feed and review queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json data/publication-review.json
          if ! git diff --cached --quiet; then git commit -m "Refresh publications and discovery queue" && git push; fi
